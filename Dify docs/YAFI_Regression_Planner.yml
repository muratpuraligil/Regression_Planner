            \ Tests\n    for j, nf_e_id in enumerate(non_func_exec_ids):\n      \
            \  if j < len(non_func_assignments) and non_func_assignments[j]:\n  \
            \          outputs[f'non_func_exec_{j+1}_link'] = run_gql(mut_tests,\
            \ {'e': nf_e_id, 't': non_func_assignments[j]})\n            \n    jira_base\
            \ = \"https://commencis.atlassian.net/browse\"\n    summary_lines =\
            \ [\n        \"Xray'de RC Planı ve Execution setleri aşağıdaki linkler\
            \ ile oluşturuldu:\\n\"\n    ]\n    \n    if plan_key:\n        summary_lines.append(f\"\
            **TestPlan:** [RC Plan {fixVersion}]({jira_base}/{plan_key}) (`{plan_key}`)\"\
            )\n    else:\n        summary_lines.append(f\"**TestPlan:** RC Plan {fixVersion}\"\
            )\n        \n    for i in range(len(func_exec_ids)):\n        e_key =\
            \ func_exec_keys[i] if i < len(func_exec_keys) and func_exec_keys[i]\
            \ else \"\"\n        if e_key:\n            summary_lines.append(f\"\
            **{i+1}.Test Execution:** [RC {fixVersion} Functional-{i+1}]({jira_base}/{e_key})\
            \ (`{e_key}`)\")\n        else:\n            summary_lines.append(f\"\
            **{i+1}.Test Execution:** RC {fixVersion} Functional-{i+1}\")\n    \
            \        \n    for j in range(len(non_func_exec_ids)):\n        nf_key\
            \ = non_func_exec_keys[j] if j < len(non_func_exec_keys) and non_func_exec_keys[j]\
            \ else \"\"\n        if nf_key:\n            summary_lines.append(f\"\
            **{j+1}.Test Execution:** [RC {fixVersion} Non-Functional-{j+1}]({jira_base}/{nf_key})\
            \ (`{nf_key}`)\")\n        else:\n            summary_lines.append(f\"\
            **{j+1}.Test Execution:** RC {fixVersion} Non-Functional-{j+1}\")\n \
            \       \n    final_result_text = \"\\n\".join(summary_lines)\n    \n\
            \    # Teams MessageCard payload with clickable markdown links + open\
            \ action button\n    teams_card = {\n        \"@type\": \"MessageCard\"\
            ,\n        \"@context\": \"http://schema.org/extensions\",\n       \
            \ \"themeColor\": \"0076D7\",\n        \"summary\": f\"YAFI Regresyon\
            \ Planı Oluşturuldu - {fixVersion}\",\n        \"sections\": [{\n   \
            \         \"activityTitle\": f\"🚀 **YAFI Regresyon Planı Oluşturuldu\
            \ (v{fixVersion})**\",\n            \"activitySubtitle\": \"Xray Test\
            \ Plan & Execution Setleri Tamamlandı\",\n            \"text\": final_result_text.replace(\"\
            \\n\", \"\\n\\n\")\n        }]\n    }\n    if plan_key:\n        teams_card[\"\
            potentialAction\"] = [{\n            \"@type\": \"OpenUri\",\n     \
            \       \"name\": f\"🔗 {plan_key} Test Planını Aç\",\n            \"\
            targets\": [{\"os\": \"default\", \"uri\": f\"{jira_base}/{plan_key}\"\
            }]\n        }]\n    \n    return {\n        \"result\": final_result_text,\n\
            \        \"teams_payload\": json.dumps(teams_card)\n    }"
