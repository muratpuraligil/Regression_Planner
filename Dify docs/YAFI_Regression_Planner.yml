      - data:
          code:
            "def main(func_cases_json, non_func_cases_json, case_count, exec_count, non_func_exec_count):\n\
            \    import json, random\n    from collections import defaultdict\n    try:\n\
            \        num_cases = int(str(case_count).strip())\n        if num_cases\
            \ <= 0: num_cases = 5\n    except:\n        num_cases = 5\n        \n\
            \    try:\n        num_execs = int(str(exec_count).strip())\n        if\
            \ num_execs <= 0: num_execs = 4\n    except:\n        num_execs = 4\n\
            \        \n    try:\n        num_nf_execs = int(str(non_func_exec_count).strip())\n\
            \        if num_nf_execs < 0: num_nf_execs = 2\n    except:\n        num_nf_execs\
            \ = 2\n        \n    # 1. Functional Distribution\n    func_data = json.loads(func_cases_json)\
            \ if func_cases_json else {}\n    func_issues = func_data.get('issues',\
            \ [])\n    func_assignments = []\n    if len(func_issues) > 0:\n   \
            \     epics = defaultdict(list)\n        for issue in func_issues:\n\
            \            f = issue.get('fields', {})\n            p = f.get('parent')\n\
            \            epic_key = (p.get('key') if isinstance(p, dict) else None)\
            \ or f.get('customfield_10008') or \"NO_EPIC\"\n            epics[epic_key].append(issue.get('id'))\n\
            \            \n        for k in epics:\n            random.shuffle(epics[k])\n\
            \        \n        epic_keys = list(epics.keys())\n        random.shuffle(epic_keys)\n\
            \        \n        total_needed = num_execs * num_cases\n        flat_func_cases\
            \ = []\n        \n        while len(flat_func_cases) < total_needed:\n\
            \            added_in_round = False\n            for ek in epic_keys:\n\
            \                if len(flat_func_cases) >= total_needed:\n         \
            \           break\n                if epics[ek]:\n                  \
            \  flat_func_cases.append(epics[ek].pop())\n                   \
            \ added_in_round = True\n            if not added_in_round:\n       \
            \         break\n                \n        for i in range(num_execs):\n\
            \            start_idx = i * num_cases\n            end_idx = start_idx\
            \ + num_cases\n            chunk = flat_func_cases[start_idx:end_idx]\n\
            \            func_assignments.append(chunk)\n    else:\n        func_assignments\
            \ = [[] for _ in range(num_execs)]\n        \n    # 2. Non-Functional\
            \ Distribution\n    non_func_data = json.loads(non_func_cases_json) if\
            \ non_func_cases_json else {}\n    non_func_issues = non_func_data.get('issues',\
            \ [])\n    nf_case_ids = [issue.get('id') for issue in non_func_issues\
            \ if issue.get('id')]\n    \n    if not nf_case_ids:\n        nf_case_ids\
            \ = [\"YFMTEST-3997\", \"YFMTEST-4007\", \"YFMTEST-4013\"]\n        \n\
            \    nf_assignments = []\n    for i in range(num_nf_execs):\n       \
            \ nf_assignments.append(list(nf_case_ids))\n                \n    return\
            \ {\n        'func_assignments_json': json.dumps(func_assignments),\n\
            \        'non_func_assignments_json': json.dumps(nf_assignments)\n  \
            \  }"
          code_language: python3
          desc: ""
          outputs:
            func_assignments_json:
              type: string
            non_func_assignments_json:
              type: string
          selected: false
          title: Distribute
          type: code
          variables:
            - value_selector:
                - normalize_cases
                - func_cases_json
              variable: func_cases_json
            - value_selector:
