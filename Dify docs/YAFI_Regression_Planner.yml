            \n        \n    client_secret = (client_secret or \"\").strip()\n   \
            \ if not client_secret:\n        client_secret = \"33e5ccbf946278c274aacd7e4a6a43b32e59f5cf6db16dba507f5bea7445dbec\"\
            \n    \n    session = requests.Session()\n    resp = session.post(\"\
            https://xray.cloud.getxray.app/api/v1/authenticate\", json={\"client_id\"\
            : client_id, \"client_secret\": client_secret}, timeout=8)\n    if resp.status_code\
            \ >= 400:\n        raise Exception(f\"Xray Auth Failed: {resp.status_code}\
            \ - {resp.text}\")\n    \n    auth_resp = resp.json()\n    token = auth_resp\
            \ if isinstance(auth_resp, str) else auth_resp.get(\"token\")\n    \n\
            \    session.headers.update({\"Authorization\": f\"Bearer {token}\",\
            \ \"Content-Type\": \"application/json\"})\n    url = \"https://xray.cloud.getxray.app/api/v2/graphql\"\
            \n    \n    def run_gql(q, v):\n        resp = session.post(url, json={'query':\
            \ q, 'variables': v}, timeout=8)\n        if resp.status_code >= 400:\n\
            \            raise Exception(f\"GraphQL Error: {resp.text}\")\n     \
            \   return resp.json()\n        \n    # 1. Link ALL executions to Test\
            \ Plan\n    if all_exec_ids and plan_id:\n        mut_plan = 'mutation($p:\
