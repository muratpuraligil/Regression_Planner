    - data:
        code: |-
          def main(cases_json):
              import json
              from collections import defaultdict
              p_order = {'Highest': 0, 'High': 1, 'Medium': 2, 'Low': 3, 'Lowest': 4}
              try:
                  cases = json.loads(cases_json) if cases_json else []
              except:
                  cases = []

              def distribute(dataset, limit):
                  epics = defaultdict(list)
                  for c in dataset:
                      epics[c.get('epic') or 'NO_EPIC'].append(c)
                  
                  for k in epics:
                      epics[k] = sorted(epics[k], key=lambda x: (p_order.get(str(x.get('priority', '')), 2), str(x.get('key'))))
                      
                  ordered = []
                  depth = 0
                  while True:
                      added = False
                      for k in sorted(epics.keys()):
                          if depth < len(epics[k]):
                              ordered.append(epics[k][depth])
                              added = True
                      depth += 1
                      if not added: break
                  return [ordered[i*limit : (i+1)*limit] for i in range(4)]

              rel = distribute([c for c in cases if c.get('source') == 'release'], 13)
              reg = distribute([c for c in cases if c.get('source') == 'regression'], 7)

              res = {}
              for i in range(4):
                  ids = [c.get('id') for c in (rel[i] + reg[i]) if c.get('id')]
                  res[f'exec{i+1}_keys_str'] = json.dumps(ids)
              return res
        code_language: python3
