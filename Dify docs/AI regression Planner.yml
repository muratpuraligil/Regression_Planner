          def main(client_id, client_secret, plan_id, exec1_res, exec2_res, exec3_res, exec4_res, add1, add2, add3, add4):
              import json, requests
              outputs = {"result": "Started"}
              resp = requests.post("https://xray.cloud.getxray.app/api/v1/authenticate", json={"client_id": client_id, "client_secret": client_secret}, timeout=15).json()
              token = resp if isinstance(resp, str) else resp.get("token")
              headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
              url = "https://xray.cloud.getxray.app/api/v2/graphql"
              def run_gql(q, v): return requests.post(url, headers=headers, json={'query': q, 'variables': v}, timeout=15).json()
              def get_id(s): return json.loads(s).get('id') if s else None
              e1i = get_id(exec1_res); e2i = get_id(exec2_res); e3i = get_id(exec3_res); e4i = get_id(exec4_res)
              e_all = [i for i in [e1i, e2i, e3i, e4i] if i]
              mut = 'mutation($p: String!, $e: [String]!) { addTestExecutionsToTestPlan(issueId: $p, testExecIssueIds: $e) { addedTestExecutions } }'
              if e_all:
                  outputs['plan_link'] = run_gql(mut, {'p': plan_id, 'e': e_all})
              mut2 = 'mutation($e: String!, $t: [String]!) { addTestsToTestExecution(issueId: $e, testIssueIds: $t) { addedTests } }'
              for i, (e_id, tests) in enumerate([(e1i, add1), (e2i, add2), (e3i, add3), (e4i, add4)]):
                  if e_id and tests:
                      outputs[f'set{i+1}'] = run_gql(mut2, {'e': e_id, 't': json.loads(tests)})
              return {"result": json.dumps(outputs, indent=2)}
        code_language: python3
