          def main(fixVersion):
              import json, requests
              headers = {
                  "Authorization": "Basic bXVyYXQucHVyYWxpZ2lsQGNvbW1lbmNpcy5jb206QVRBVFQzeEZmR0YwZTVNNUFIMVp3ZVBSRE5qc3RQZDA0OG9JNFk5dGxEaTU4V3g2QmFiU0Fock93Qjdsc3ZnX0xzVm1za1AtdVJRcTlMcXFLdUpvanFlRl9BU1VGOFpiOXgyNWM5c0h4T2VWMEN2OG4tbDJaek9DRHVXc2dOZ2FEOGlzM0F4NWtYRUhoR2R1QXZqZUxtSUhweHJJWXpncnFrMUphbEpYTFliTzFLV20zQWQzc3FNPThBMERFQzNF",
                  "Content-Type": "application/json"
              }
              j1 = f'project = ISCEPTEST AND "Is Regression[Dropdown]" = YES AND type = "Test" AND fixVersion in ("{fixVersion}") ORDER BY parent ASC'
              u1 = f'https://commencis.atlassian.net/rest/api/3/search/jql?jql={requests.utils.quote(j1)}&maxResults=200'
              u2 = f'https://commencis.atlassian.net/rest/api/3/search?jql={requests.utils.quote("filter=14716")}&maxResults=200'
              
              def fetch(u, src):
                  try:
                      r = requests.get(u, headers=headers, timeout=15)
                      if r.status_code != 200: return []
                      res = []
                      for i in r.json().get('issues', []):
                          f = i.get('fields') or {}
                          p = f.get('parent')
                          epic_key = (p.get('key') if isinstance(p, dict) else None) or f.get('customfield_10008') or "NO_EPIC"
                          res.append({
                              'key': i.get('key'),
                              'id': i.get('id'),
                              'epic': epic_key,
                              'priority': f.get('priority', {}) and f.get('priority', {}).get('name', 'Medium') or 'Medium',
                              'source': src
                          })
                      return res
                  except Exception as e:
                      return []
                      
              return {'body': json.dumps(fetch(u1, "release") + fetch(u2, "regression"))}
        code_language: python3
